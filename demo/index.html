<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Homelab Service Card – demo</title>
  <!--
    Local preview without Home Assistant. Open this file in a browser.
    ha-card is stubbed below; the real one comes from Home Assistant.
  -->
  <style>
    body {
      margin: 0;
      padding: 24px;
      font-family: Roboto, "Segoe UI", system-ui, sans-serif;
      background: #eef0f3;
      --primary-text-color: #1c1b2e;
      --divider-color: rgba(0, 0, 0, 0.12);
      --success-color: #2e7d32;
      --error-color: #c62828;
      display: grid;
      grid-template-columns: 640px 420px;
      gap: 16px;
    }
  </style>
</head>
<body>
  <script>
    customElements.define("ha-card", class extends HTMLElement {
      constructor() {
        super();
        this.attachShadow({ mode: "open" }).innerHTML = `
          <style>:host{display:block;background:#fff;border-radius:12px;
          box-shadow:0 1px 3px rgba(0,0,0,.12)}</style><slot></slot>`;
      }
    });
  </script>
  <script src="../dist/homelab-service-card.js"></script>
  <script>
    const hass = {
      states: {
        "binary_sensor.paperless_status": { state: "on", attributes: { friendly_name: "Paperless status" } },
        "sensor.paperless_response_time": {
          state: "140", attributes: { friendly_name: "Response Time", unit_of_measurement: "ms" },
        },
        "sensor.paperless_documents": { state: "1832", attributes: { friendly_name: "Documents" } },
        "sensor.paperless_long": {
          state: "12", attributes: { friendly_name: "Paperless Ngx documents waiting in the consumption folder for processing" },
        },
        "sensor.jellyfin_status": { state: "down", attributes: { friendly_name: "Jellyfin" } },
        "sensor.jellyfin_response_time": {
          state: "unavailable", attributes: { friendly_name: "Response Time", unit_of_measurement: "ms" },
        },
      },
    };

    const cards = [
      {
        name: "Paperless Ngx",
        url: "https://paperless.example.com",
        icon: "https://cdn.jsdelivr.net/gh/selfhst/icons/svg/paperless-ngx.svg",
        icon_size: 48,
        status_entity: "binary_sensor.paperless_status",
        entities: [
          "sensor.paperless_response_time",
          { entity: "sensor.paperless_documents", name: "Docs" },
          "sensor.paperless_long",
        ],
      },
      {
        name: "Jellyfin",
        url: "https://jellyfin.example.com",
        icon: "https://cdn.jsdelivr.net/gh/selfhst/icons/svg/jellyfin.svg",
        icon_size: 40,
        status_entity: "sensor.jellyfin_status",
        entities: ["sensor.jellyfin_response_time"],
      },
    ];

    for (const config of cards) {
      const card = document.createElement("homelab-service-card");
      card.setConfig(config);
      card.hass = hass;
      document.body.appendChild(card);
    }
  </script>
</body>
</html>
