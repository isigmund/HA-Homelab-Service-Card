name: Release

# Attaches the card file to every published GitHub release.
# HACS installs the file from the release, so the version users get
# always matches the release tag.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload card to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/homelab-service-card.js --clobber
